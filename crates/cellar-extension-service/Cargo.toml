[package]
name = "cellar-extension-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
cellar-core = { path = "../cellar-core" }
cellar-sql = { path = "../cellar-sql" }
cellar-diff = { path = "../cellar-diff" }
cellar-secrets = { path = "../cellar-secrets" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
sqlparser = { version = "0.52", features = ["visitor"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite", "json"] }
