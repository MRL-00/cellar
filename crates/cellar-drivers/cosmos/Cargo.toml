[package]
name = "cellar-driver-cosmos"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cellar — Azure Cosmos DB (NoSQL) driver via the REST data plane"
publish = false

[dependencies]
cellar-core = { path = "../../cellar-core" }
async-trait = "0.1"
base64 = "0.22"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
