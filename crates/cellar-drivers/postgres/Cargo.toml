[package]
name = "cellar-driver-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cellar — Postgres driver built on sqlx"
publish = false

[dependencies]
cellar-core = { path = "../../cellar-core" }
cellar-diff = { path = "../../cellar-diff" }
cellar-sql = { path = "../../cellar-sql" }
async-trait = "0.1"
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
cellar-ssh = { path = "../../cellar-ssh" }
native-tls = "0.2"
tokio-native-tls = "0.3"
dirs = "6"
url = "2"
chrono = { version = "0.4", features = ["serde"], default-features = false }
uuid = { version = "1", features = ["serde"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }

[features]
default = []
# Enable Postgres-backed integration tests with `cargo test --features integration-tests`.
# These spin up a Postgres 15 container via testcontainers and require Docker.
integration-tests = []

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
