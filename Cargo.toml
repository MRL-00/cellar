[workspace]
resolver = "2"
members = [
    "apps/desktop-gpui",
    "crates/cellar-ai",
    "crates/cellar-core",
    "crates/cellar-runtime",
    "crates/cellar-drivers/convex",
    "crates/cellar-drivers/cosmos",
    "crates/cellar-drivers/firestore",
    "crates/cellar-drivers/mysql",
    "crates/cellar-drivers/postgres",
    "crates/cellar-drivers/sqlite",
    "crates/cellar-drivers/sqlserver",
    "crates/cellar-sql",
    "crates/cellar-diff",
    "crates/cellar-schema-diff",
    "crates/cellar-secrets",
]

[workspace.package]
version = "1.0.9"
edition = "2021"
license = "MIT"
repository = "https://github.com/nzmrl/cellar"

[workspace.dependencies]
# async
tokio = { version = "1", features = ["full"] }
# error handling
thiserror = "1"
anyhow = "1"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
