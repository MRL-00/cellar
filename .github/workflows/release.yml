name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release, for example 0.1.0"
        required: true
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            stable-asset-name: Cellar-mac-arm64.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            release_tag="$version"
          else
            version="${GITHUB_REF_NAME}"
            release_tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be a plain semver tag like 0.1.0 or 0.1.0-alpha.1" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_CERTIFICATE_BASE64:?DEVELOPER_ID_CERTIFICATE_BASE64 secret is required}"
          : "${DEVELOPER_ID_CERTIFICATE_PASSWORD:?DEVELOPER_ID_CERTIFICATE_PASSWORD secret is required}"

          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/cellar-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          echo "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail
          : "${APP_STORE_CONNECT_API_KEY_BASE64:?APP_STORE_CONNECT_API_KEY_BASE64 secret is required}"
          : "${APP_STORE_CONNECT_KEY_ID:?APP_STORE_CONNECT_KEY_ID secret is required}"

          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$api_key_path"
          chmod 600 "$api_key_path"

      - name: Stamp release version into tauri.conf.json
        shell: bash
        run: |
          set -euo pipefail
          conf="apps/desktop/src-tauri/tauri.conf.json"
          tmp="$(mktemp)"
          jq --arg v "${{ steps.release.outputs.version }}" '.version = $v' "$conf" > "$tmp"
          mv "$tmp" "$conf"
          echo "tauri.conf.json version set to ${{ steps.release.outputs.version }}"

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          APPLE_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Cellar ${{ steps.release.outputs.version }}
          # Draft-only placeholder; publish-release overwrites the body with
          # the version's CHANGELOG.md section before publishing.
          releaseBody: See the assets below to download Cellar for your platform.
          releaseDraft: true
          prerelease: ${{ steps.release.outputs.prerelease }}
          updaterJsonPreferNsis: false
          args: ${{ matrix.args }}

      - name: Upload stable direct-download asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          STABLE_ASSET_NAME: ${{ matrix.stable-asset-name }}
          TARGET_TRIPLE: ${{ matrix.rust-targets }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          # The build output may land at either the repo-root target dir
          # (when CARGO_TARGET_DIR is set by rust-cache) or under
          # apps/desktop/src-tauri/target. Search both.
          search_roots=(target "apps/desktop/src-tauri/target")

          dmg_path="$(find "${search_roots[@]}" \
            -path "*/$TARGET_TRIPLE/release/bundle/dmg/*.dmg" -type f \
            -print -quit 2>/dev/null || true)"
          if [[ -z "$dmg_path" ]]; then
            echo "No DMG artifact found for $TARGET_TRIPLE" >&2
            exit 1
          fi

          echo "Found DMG at: $dmg_path"
          # Copy to a stable name — the # rename syntax in gh is unreliable.
          cp "$dmg_path" "/tmp/$STABLE_ASSET_NAME"
          gh release upload "$RELEASE_TAG" "/tmp/$STABLE_ASSET_NAME" --clobber

          # Sign the .app.tar.gz updater bundle and upload both files under
          # stable names that match the URLs emitted in latest.json.
          # tauri-action@v0 doesn't correctly handle Tauri v2 updater artifacts,
          # so we sign the bundle ourselves using the tauri CLI.
          bundle_root="$(dirname "$(dirname "$dmg_path")")"
          macos_dir="$bundle_root/macos"
          tarball="$(find "$macos_dir" -name "*.app.tar.gz" -type f -print -quit 2>/dev/null || true)"

          if [[ -n "$tarball" ]]; then
            stable_bundle_name="Cellar_aarch64.app.tar.gz"
            stable_sig_name="${stable_bundle_name}.sig"

            echo "Signing updater bundle: $tarball"
            npx @tauri-apps/cli signer sign \
              -k "$TAURI_SIGNING_PRIVATE_KEY" \
              -p "" \
              "$tarball"

            sig_file="${tarball}.sig"
            if [[ -f "$sig_file" ]]; then
              cp "$tarball" "/tmp/$stable_bundle_name"
              cp "$sig_file" "/tmp/$stable_sig_name"
              echo "Uploading updater bundle as $stable_bundle_name"
              gh release upload "$RELEASE_TAG" "/tmp/$stable_bundle_name" --clobber
              echo "Uploading signature as $stable_sig_name"
              gh release upload "$RELEASE_TAG" "/tmp/$stable_sig_name" --clobber
            else
              echo "Sign command did not produce $sig_file" >&2
              ls -la "$macos_dir"
              exit 1
            fi
          else
            echo "No .app.tar.gz found under $macos_dir" >&2
            exit 1
          fi

  publish-release:
    name: Publish release
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="${{ inputs.version }}"
          else
            release_tag="${GITHUB_REF_NAME}"
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Prefix-match the heading (tolerates "## x.y.z - date" styles) and
          # skip blank lines before the first content line.
          awk -v ver="$RELEASE_TAG" \
            '$0 ~ "^## " ver "([[:space:]]|$)" {found=1; next}
             /^## / {found=0}
             found && (started || NF) {started=1; print}' \
            CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "No CHANGELOG.md section for $RELEASE_TAG — falling back to placeholder" >&2
            echo "See the assets below to download Cellar for your platform." \
              > "$RUNNER_TEMP/release-notes.md"
          fi

          cat "$RUNNER_TEMP/release-notes.md"

          # Full changelog (minus the "# Changelog" title) for latest.json, so
          # users jumping multiple versions see every release in between; the
          # app trims it to sections newer than the installed version.
          tail -n +2 CHANGELOG.md > "$RUNNER_TEMP/changelog-full.md"

      - name: Generate and upload updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          # Download the Apple Silicon signature to build latest.json. Cellar
          # 0.3.5 is the final Intel release; later manifests intentionally
          # omit darwin-x86_64 so those installations remain on 0.3.5.
          tmpdir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" \
            --pattern 'Cellar_aarch64.app.tar.gz.sig' \
            --dir "$tmpdir"

          aarch64_sig="$(cat "$tmpdir/Cellar_aarch64.app.tar.gz.sig")"
          base_url="https://github.com/${GH_REPO}/releases/download/${RELEASE_TAG}"
          pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          jq -n \
            --arg version "$RELEASE_TAG" \
            --rawfile notes "$RUNNER_TEMP/changelog-full.md" \
            --arg pub_date "$pub_date" \
            --arg signature "$aarch64_sig" \
            --arg url "$base_url/Cellar_aarch64.app.tar.gz" \
            '{version: $version, notes: ($notes | rtrimstr("\n")), pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$tmpdir/latest.json"

          echo "Generated latest.json:"
          cat "$tmpdir/latest.json"
          gh release upload "$RELEASE_TAG" "$tmpdir/latest.json" --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft=false
