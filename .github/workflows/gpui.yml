name: GPUI desktop

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-build:
    name: ${{ matrix.name }} release build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests build macOS only; pushes to main build every platform.
        # A job-level `if` can't read `matrix`, so the event picks the list here.
        include: ${{ fromJSON(github.event_name == 'push' && '[{"name":"macOS","os":["self-hosted","macOS","ARM64","mac-mini"]},{"name":"Linux","os":["self-hosted","Linux","X64","ubuntu-vm"]},{"name":"Windows","os":"windows-latest"}]' || '[{"name":"macOS","os":["self-hosted","macOS","ARM64","mac-mini"]}]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - name: Build optimized GPUI desktop
        run: cargo build --locked --release -p cellar-desktop-gpui

      - name: Run native model tests
        run: cargo test --locked -p cellar-desktop-gpui

