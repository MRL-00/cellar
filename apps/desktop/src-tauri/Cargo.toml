[package]
name = "cellar-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cellar desktop app — Tauri shell"
publish = false
# `tauri dev` invokes `cargo run` with no --bin. Without this, Cargo errors
# because the codegen binary makes the choice ambiguous.
default-run = "cellar-desktop"

[lib]
name = "cellar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cellar-codegen"
path = "src/bin/codegen.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
dirs = "5"
specta = { version = "=2.0.0-rc.22", features = ["derive", "chrono", "uuid", "serde_json"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
cellar-core = { path = "../../../crates/cellar-core" }
cellar-driver-postgres = { path = "../../../crates/cellar-drivers/postgres" }
cellar-secrets = { path = "../../../crates/cellar-secrets" }
